<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hum Hain Pakistan | SDG Youth Campaign Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Lora:wght@400;500;600;700&family=Georgia&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --forest:#185D35;
  --forest-dark:#0F3F24;
  --forest-tint:#E7F0EA;
  --gold:#ECC070;
  --gold-dark:#C99A3E;
  --cream:#FAF7EF;
  --ink:#1E2B22;
  --slate:#5B6B60;
  --line:#DCE3D6;
  --white:#FFFFFF;
  --danger:#A6402B;
  --danger-tint:#F7E9E4;
  --success:#2E7D4F;
  --radius:14px;
  --shadow:0 2px 10px rgba(24,93,53,0.08), 0 1px 2px rgba(24,93,53,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'Lora',system-ui,serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Montserrat',system-ui,sans-serif; font-weight:700; margin:0 0 6px 0; color:var(--forest-dark);}
p{margin:0 0 12px 0; line-height:1.55; color:var(--ink);}
a{color:var(--forest);}
button{font-family:inherit;}

/* ---------- App shell ---------- */
.topbar{
  background:linear-gradient(135deg,var(--forest) 0%, var(--forest-dark) 100%);
  color:var(--white);
  padding:16px 28px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:var(--shadow);
  position:sticky; top:0; z-index:50;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{width:40px; height:40px; flex-shrink:0; background:var(--white);
  border-radius:50%; padding:2px; object-fit:contain;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.topbar-logo{height:40px; width:40px; flex-shrink:0; background:var(--white);
  border-radius:50%; padding:2px; object-fit:contain;}
@media(max-width:600px){.brand-mark,.topbar-logo{width:32px; height:32px;}}
.brand-text .title{font-family:'Montserrat'; font-weight:700; font-size:17px; letter-spacing:.2px;}
.brand-text .subtitle{font-size:11.5px; color:var(--gold); font-weight:600; letter-spacing:.6px; text-transform:uppercase;}
.role-pill{
  background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.25);
  color:var(--white); padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:600;
  display:flex; align-items:center; gap:8px;
}
.role-pill button{
  background:var(--gold); color:var(--forest-dark); border:none; padding:5px 12px;
  border-radius:999px; font-weight:700; font-size:11.5px; cursor:pointer;
}
.role-pill button:hover{background:var(--gold-dark); color:var(--white);}

.shell{max-width:1180px; margin:0 auto; padding:32px 24px 64px;}
.view{display:none;}
.view.active{display:block; animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Cards / layout ---------- */
.card{
  background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
  padding:26px 28px; box-shadow:var(--shadow); margin-bottom:22px;
}
.card-tight{padding:18px 20px;}
.grid{display:grid; gap:20px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:820px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.eyebrow{
  text-transform:uppercase; letter-spacing:1.2px; font-size:11.5px; font-weight:700;
  color:var(--gold-dark); margin-bottom:8px; display:block;
}

/* ---------- Buttons / inputs ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--forest); color:var(--white); border:none; padding:12px 22px;
  border-radius:10px; font-weight:600; font-size:14.5px; cursor:pointer; transition:.15s ease;
}
.btn:hover{background:var(--forest-dark);}
.btn:disabled{background:#B7C4BB; cursor:not-allowed;}
.btn-gold{background:var(--gold); color:var(--forest-dark);}
.btn-gold:hover{background:var(--gold-dark); color:var(--white);}
.btn-outline{background:transparent; color:var(--forest); border:1.5px solid var(--forest);}
.btn-outline:hover{background:var(--forest-tint);}
.btn-danger{background:var(--danger); color:var(--white);}
.btn-danger:hover{background:#832F20;}
.btn-block{width:100%;}
.btn-row{display:flex; gap:12px; flex-wrap:wrap; margin-top:18px;}

label{display:block; font-size:13px; font-weight:600; color:var(--forest-dark); margin:14px 0 6px;}
label:first-child{margin-top:0;}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:9px;
  font-size:14.5px; font-family:inherit; background:var(--white); color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--forest);}
.field-hint{font-size:12px; color:var(--slate); margin-top:4px;}
.error-box{
  background:var(--danger-tint); color:var(--danger); border:1px solid #E7C7BC;
  padding:11px 14px; border-radius:99px; font-size:13.5px; font-weight:600; margin-top:10px;
}

/* ---------- Impact ring (signature element) ---------- */
.ring-wrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
.ring-score{font-family:'Montserrat'; font-weight:800; font-size:26px; fill:var(--forest-dark);}

/* ---------- Tables ---------- */
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{
  text-align:left; padding:10px 12px; background:var(--forest-tint); color:var(--forest-dark);
  font-family:'Montserrat'; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.4px;
  border-bottom:2px solid var(--line);
}
td{padding:10px 12px; border-bottom:1px solid var(--line); color:var(--ink);}
tr:hover td{background:#FBFDFA;}
.table-wrap{overflow-x:auto; border-radius:10px; border:1px solid var(--line);}
.table-wrap table{border-radius:10px;}
.badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700;}
.badge-pass{background:#E4F3E9; color:var(--success);}
.badge-fail{background:var(--danger-tint); color:var(--danger);}
.badge-neutral{background:var(--forest-tint); color:var(--forest-dark);}

/* ---------- Stat tiles ---------- */
.stat-tile{
  background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px 22px; box-shadow:var(--shadow);
}
.stat-tile .num{font-family:'Montserrat'; font-size:30px; font-weight:800; color:var(--forest-dark);}
.stat-tile .label{font-size:12.5px; color:var(--slate); font-weight:600; text-transform:uppercase; letter-spacing:.4px;}
.stat-tile.gold .num{color:var(--gold-dark);}

/* ---------- Progress bar ---------- */
.pbar{height:9px; background:var(--forest-tint); border-radius:999px; overflow:hidden;}
.pbar > div{height:100%; background:var(--forest); border-radius:999px; transition:width .4s ease;}

/* ---------- Quiz / survey ---------- */
.q-block{padding:18px 0; border-bottom:1px solid var(--line);}
.q-block:last-child{border-bottom:none;}
.q-num{color:var(--gold-dark); font-weight:800; font-family:'Montserrat'; font-size:13px; margin-bottom:4px; display:block;}
.q-text{font-size:15px; font-weight:600; margin-bottom:12px; color:var(--forest-dark);}
.opt{
  display:flex; align-items:center; gap:10px; padding:10px 14px; border:1.5px solid var(--line);
  border-radius:99px; margin-bottom:8px; cursor:pointer; transition:.12s ease;
}
.opt:hover{border-color:var(--gold);}
.opt.selected{border-color:var(--forest); background:var(--forest-tint);}
.opt input{margin:0;}
.likert-row{display:flex; gap:8px; flex-wrap:wrap;}
.likert-opt{
  flex:1; min-width:80px; text-align:center; padding:10px 6px; border:1.5px solid var(--line);
  border-radius:9px; cursor:pointer; font-size:12px; font-weight:600; color:var(--slate);
}
.likert-opt.selected{border-color:var(--forest); background:var(--forest); color:var(--white);}
.section-tag{
  display:inline-block; background:var(--gold); color:var(--forest-dark); font-weight:700;
  font-size:11px; text-transform:uppercase; letter-spacing:.5px; padding:4px 10px; border-radius:6px; margin-bottom:14px;
}

/* ---------- Certificate ---------- */
.cert-outer{display:flex; justify-content:center; padding:20px 0;}
.cert-page{
  width:1123px; height:794px;
  background:var(--white);
  position:relative;
  box-shadow:0 8px 30px rgba(0,0,0,0.18);
  font-family:Georgia, 'Times New Roman', serif;
}
.cert-inner{
  position:absolute; top:24px; left:24px; right:24px; bottom:24px;
  border:3px solid var(--forest);
  padding:16px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
}
.cert-inner:before{
  content:""; position:absolute; top:10px; left:10px; right:10px; bottom:10px;
  border:1.5px solid var(--gold);
}
.cert-eyebrow{color:var(--gold-dark); letter-spacing:3px; font-size:13px; font-weight:bold; text-transform:uppercase; margin-bottom:6px;}
.cert-title{color:var(--forest-dark); font-size:40px; font-weight:bold; margin:2px 0 4px;}
.cert-sub{color:var(--slate); font-size:14px; margin-bottom:22px; font-style:italic;}
.cert-name{font-size:32px; color:var(--forest); border-bottom:2px solid var(--gold); padding:0 30px 6px; margin-bottom:14px; font-weight:bold;}
.cert-body{max-width:640px; font-size:14.5px; color:var(--ink); line-height:1.7; margin-bottom:20px;}
.cert-body b{color:var(--forest-dark);}
.cert-footer{display:flex; justify-content:space-between; width:80%; margin-top:10px;}
.cert-footer .sig{text-align:center; font-size:12px; color:var(--slate);}
.cert-footer .sig .line{border-top:1.5px solid var(--ink); width:170px; margin-bottom:6px;}
.cert-seal{position:absolute; bottom:26px; right:40px; width:76px; height:76px; opacity:.92;}
.cert-logo{position:absolute; top:16px; height:96px; width:auto;}
.cert-logo.left{left:26px;}
.cert-logo.right{right:26px;}

/* ---------- Role Select Grid ---------- */
.role-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:10px;}
@media(max-width:900px){.role-grid{grid-template-columns:repeat(2,1fr);}}
.role-card{
  background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
  padding:24px 20px; text-align:left; cursor:pointer; transition:.18s ease; box-shadow:var(--shadow);
}
.role-card:hover{border-color:var(--gold); transform:translateY(-3px);}
.role-card .icon{width:38px; height:38px; margin-bottom:14px;}
.role-card h3{font-size:16px; margin-bottom:6px;}
.role-card p{font-size:13px; color:var(--slate); margin:0;}
.hero{text-align:center; padding:38px 20px 8px;}
.hero h1{font-size:32px; margin-bottom:10px;}
.hero p.lead{max-width:560px; margin:0 auto 26px; color:var(--slate); font-size:15.5px;}

/* ---------- Misc ---------- */
.muted{color:var(--slate); font-size:13.5px;}
.flex-between{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
.tag-key{
  font-family:monospace; background:var(--forest-tint); color:var(--forest-dark); padding:6px 10px;
  border-radius:6px; font-weight:700; letter-spacing:1px; font-size:14px;
}
.back-link{cursor:pointer; color:var(--forest); font-weight:600; font-size:13.5px; display:inline-flex; align-items:center; gap:5px; margin-bottom:18px;}
.back-link:hover{text-decoration:underline;}
.chart-box{position:relative; height:260px;}
.pill-tabs{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
.pill-tab{
  padding:8px 16px; border-radius:999px; border:1.5px solid var(--line); font-size:13px; font-weight:600;
  color:var(--slate); cursor:pointer; background:var(--white);
}
.pill-tab.active{background:var(--forest); color:var(--white); border-color:var(--forest);}
/* ---------- Drill-down floating window ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(15,63,36,0.45); z-index:200;
  display:flex; align-items:center; justify-content:center; padding:20px;
  animation:fadein .18s ease;
}
.modal-card{
  background:var(--white); border-radius:var(--radius); box-shadow:0 18px 60px rgba(0,0,0,0.30);
  max-width:880px; width:100%; max-height:90vh; overflow-y:auto; padding:24px 26px;
}
.modal-close{
  background:var(--forest-tint); border:none; color:var(--forest-dark); font-weight:700;
  border-radius:999px; width:32px; height:32px; cursor:pointer; font-size:15px; flex-shrink:0;
}
.modal-close:hover{background:var(--danger-tint); color:var(--danger);}
.modal-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:14px;}
@media(max-width:760px){.modal-grid{grid-template-columns:1fr;}}

/* ---------- ON/OFF segmented toggle ---------- */
.seg-toggle{display:inline-flex; border:1.5px solid var(--line); border-radius:999px; overflow:hidden;}
.seg-toggle button{
  border:none; background:var(--white); color:var(--slate); font-weight:700; font-size:12.5px;
  padding:8px 22px; cursor:pointer; letter-spacing:.6px; transition:.12s ease;
}
.seg-toggle button.active-on{background:var(--success); color:var(--white);}
.seg-toggle button.active-off{background:var(--danger); color:var(--white);}

@media print{
  .topbar,.no-print{display:none !important;}
  body{background:white;}
}

/* ---------- Sync status badge ---------- */
.sync-badge{
  position:fixed; bottom:16px; right:16px; z-index:300;
  background:var(--white); border:1px solid var(--line); box-shadow:var(--shadow);
  border-radius:999px; padding:7px 14px; font-size:12px; font-weight:600;
  color:var(--slate); display:flex; align-items:center; gap:7px; cursor:pointer;
  transition:.15s ease; user-select:none;
}
.sync-badge:hover{border-color:var(--gold);}
.sync-dot{width:8px; height:8px; border-radius:50%; background:var(--slate); flex-shrink:0;}
.sync-badge.state-synced .sync-dot{background:var(--success);}
.sync-badge.state-syncing .sync-dot,
.sync-badge.state-pending .sync-dot,
.sync-badge.state-connecting .sync-dot{background:var(--gold-dark); animation:syncpulse 1s infinite;}
.sync-badge.state-error .sync-dot,
.sync-badge.state-offline .sync-dot{background:var(--danger);}
@keyframes syncpulse{0%,100%{opacity:1;} 50%{opacity:.3;}}
@media(max-width:600px){.sync-badge{bottom:10px; right:10px; padding:6px 12px; font-size:11px;}}
</style>
</head>
<body>

<div class="topbar no-print">
  <div class="brand">
    <img class="brand-mark" id="topbarLogoLeft" alt="Parliamentary Task Force on SDGs">
    <div class="brand-text">
      <div class="title">Hum Hain Pakistan</div>
      <div class="subtitle">SDG Youth Campaign</div>
    </div>
  </div>
  <div class="topbar-right">
    <div id="roleIndicator" class="role-pill" style="display:none;">
      <span id="roleIndicatorText"></span>
      <button onclick="App.logout()">Switch role</button>
    </div>
    <img class="topbar-logo" id="topbarLogoRight" alt="International Governance and Sustainability Institute">
  </div>
</div>

<div class="shell" id="shell">
  <!-- Dynamic Injection View Layer -->
</div>

<div class="sync-badge no-print state-connecting" id="syncBadge" onclick="manualSync()" title="Click to pull the latest shared data">
  <span class="sync-dot"></span><span id="syncBadgeText">Connecting to shared data…</span>
</div>

/* ============================================================
   FIREBASE FIRESTORE SYNC LAYER
   Replaces the old Apps Script/Google Sheets transport. Firestore gives
   every record a real, stable document ID from the start, so the
   whole "match by exact name string, reconcile, allow-delete" dance
   that caused the institution-name and student-demographics incidents
   is gone by construction — a write always targets one specific
   document, never a text-matched row.
   No dashboard function/logic below this block is altered — this only
   changes what loadData()/saveData() do under the hood, exactly as the
   Apps Script layer did before it.
   ============================================================ */

const GATE_DEFS = [
  { id:'pre',  name:'Pre-Assessment Survey',  settingKey:'preOpen'  },
  { id:'post', name:'Post-Assessment Survey', settingKey:'postOpen' },
  { id:'quiz', name:'SDG Quiz',               settingKey:'quizOpen' }
];

/* ---------- Local bookkeeping: which append-only records have already
   reached Firestore, so a push only ever writes genuinely new documents. ---------- */
const SYNCED_IDS_KEY = 'hhp_synced_ids_v1';
function loadSyncedIds(){
  try{
    const parsed = JSON.parse(localStorage.getItem(SYNCED_IDS_KEY));
    return { students: parsed?.students||[], surveys: parsed?.surveys||[], quizzes: parsed?.quizzes||[] };
  }catch(e){ return { students:[], surveys:[], quizzes:[] }; }
}
function saveSyncedIds(){ localStorage.setItem(SYNCED_IDS_KEY, JSON.stringify(_syncedIds)); }
let _syncedIds = loadSyncedIds();

/* Firestore batches are capped at 500 writes each. */
async function commitInChunks(writeFns){
  let batch = fsdb.batch(), count = 0;
  for(const w of writeFns){
    w(batch);
    count++;
    if(count === 450){ await batch.commit(); batch = fsdb.batch(); count = 0; }
  }
  if(count > 0) await batch.commit();
}

/* ---------- Row shape helpers (map DB records <-> Firestore documents) ---------- */
function fullStudentName(s){ return [s.firstName, s.middleName, s.lastName].filter(Boolean).join(' '); }
function instNameById(id){ const i = DB.institutions.find(x=>x.id===id); return i ? i.name : ''; }
/* ---------- Section 1 knowledge scoring ----------
   The awareness construct is now the Section 1 objective score (Q2-Q19),
   not a Likert average. Q1 is self-reported familiarity and Q20 is the
   self-report anchor, so neither is scored. The Aware / Not Yet Aware
   cut score is NOT set here: the dashboard records the inputs and the
   threshold is derived offline (ROC against the Q20 anchor). */
function section1Score(answers){
  let score = 0, total = 0;
  SECTION1_SCORED_IDS.forEach(id => {
    const q = (DB.questions.pre || []).find(x => x.id === id) || (DB.questions.post || []).find(x => x.id === id);
    if(!q || !q.correct) return;
    total++;
    if(answers[id] === q.correct[0]) score++;
  });
  return { score, total, pct: total ? Math.round(score/total*100) : 0 };
}
/* Q20 collapsed to the binary criterion: Moderate/Strong = aware */
function anchorBinary(answers){
  const v = answers[ANCHOR_ID];
  if(v == null) return '';
  return v >= 2 ? 'Aware' : 'Not Yet Aware';
}
/* Mean Section 1 % correct across every submitted survey of a phase */
function meanSection1Pct(surveys){
  if(!surveys.length) return 0;
  let sum = 0, n = 0;
  surveys.forEach(s => { const r = section1Score(s.answers); if(r.total){ sum += r.pct; n++; } });
  return n ? sum/n : 0;
}
function studentToRow(s){
  return {
    firstName: s.firstName || '', middleName: s.middleName || '', lastName: s.lastName || '',
    gender: s.gender || '', level: s.level || '', className: s.className || '', sectionName: s.sectionName || '',
    institutionId: s.institutionId || null, createdAt: s.createdAt
  };
}
/* Surveys/quizzes are written with BOTH native fields (studentId,
   institutionId, phase, answers as a real object) that pull-side reads
   directly with no parsing, AND the same flattened human-readable fields
   (q1..q44, student_name, school_name, etc.) the pre-Firebase sheet used —
   kept for continuity with the migrated history and so anyone opening
   Firestore directly can still make sense of a record. */
function surveyToRow(s){
  const stu = DB.students.find(x=>x.id===s.studentId);
  const sec1 = section1Score(s.answers);
  const row = {
    studentId: s.studentId, institutionId: s.institutionId, phase: s.phase,
    answers: {...s.answers}, submittedAt: s.submittedAt,
    timestamp: s.submittedAt,
    student_name: stu ? fullStudentName(stu) : '',
    school_name: stu ? instNameById(stu.institutionId) : '',
    assessment_type: s.phase,
    instrument_version: DB.instrumentVersion || INSTRUMENT_VERSION,
    section1_score: sec1.score,
    section1_total: sec1.total,
    section1_pct: sec1.pct,
    anchor_q20: s.answers[ANCHOR_ID] != null ? s.answers[ANCHOR_ID] + 1 : '',
    anchor_binary: anchorBinary(s.answers)
  };
  /* Responses are written as 1-based option numbers, matching how the
     options are numbered in the printed instrument. Multi-select items
     are semicolon separated (e.g. "1;3;6"). Section 5 stays blank on
     pre-survey rows. This flattened copy is not what pull-side actually
     reads (it reads the native "answers" field above) — it's kept purely
     for continuity/readability. */
  surveyQuestions(s.phase).forEach(q=>{
    const v = s.answers[q.id];
    if(v == null){ row[q.id] = ''; return; }
    row[q.id] = Array.isArray(v) ? v.map(n=>n+1).join(';') : (v + 1);
  });
  return row;
}
function quizToRow(q){
  const stu = DB.students.find(x=>x.id===q.studentId);
  return {
    studentId: q.studentId, institutionId: q.institutionId, answers: {...q.answers},
    score: q.score, total: q.total, pct: q.pct, passed: q.passed, submittedAt: q.submittedAt,
    timestamp: q.submittedAt,
    student_name: stu ? fullStudentName(stu) : '',
    school_name: stu ? instNameById(stu.institutionId) : '',
    total_questions: q.total,
    passing_status: q.passed ? 'PASS' : 'FAIL',
    certificate_id: q.passed ? q.id : ''
  };
}
function institutionToRow(inst){
  return {
    name: inst.name, type: inst.type || 'school', key: inst.key || null,
    abbr: inst.abbr || '', archived: !!inst.archived,
    total_enrolled: summaryFor(inst.id).registered // snapshot only, app always recomputes live
  };
}

/* ---------- Pull: rebuild DB from Firestore ---------- */
/* ---------- Core pull: institutions + gates + config only ----------
   Everyone needs this at boot regardless of role — the registration
   dropdown, phase-gate checks, and the question bank all come from here.
   Deliberately does NOT touch students/surveys/quizzes: those collections
   are thousands of documents and reading them for every idle visitor is
   what actually exhausted the daily read quota at this campaign's scale.
   Returns a PARTIAL shape (no students/surveys/quizzes/keys) — callers
   must merge this in with Object.assign(DB, core), never DB = core,
   or they'll wipe out whatever's already cached locally. */
async function pullCoreFromBackend(){
  const [instSnap, gatesDoc, appDoc] = await Promise.all([
    fsdb.collection('institutions').get(),
    fsdb.collection('config').doc('gates').get(),
    fsdb.collection('config').doc('app').get()
  ]);
  _lastPullAt = Date.now();
  if(instSnap.empty && !gatesDoc.exists && !appDoc.exists) return null;

  const institutions = instSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  const settings = { ...DB.settings };
  if(gatesDoc.exists){
    const g = gatesDoc.data();
    GATE_DEFS.forEach(def=>{ if(g[def.settingKey] !== undefined) settings[def.settingKey] = !!g[def.settingKey]; });
  }

  let igsiPassword = DB.igsiPassword, taskforcePassword = DB.taskforcePassword, questions = DB.questions;
  let instrumentVersion = DB.instrumentVersion || 0;
  if(appDoc.exists){
    const a = appDoc.data();
    if(a.igsiPassword) igsiPassword = a.igsiPassword;
    if(a.taskforcePassword) taskforcePassword = a.taskforcePassword;
    if(a.questions) questions = a.questions;
    if(a.instrumentVersion != null) instrumentVersion = Number(a.instrumentVersion) || 0;
  }

  return { institutions, settings, igsiPassword, taskforcePassword, questions, instrumentVersion };
}

/* ---------- One returning student's own history ----------
   Bounded to exactly one student's records (typically 0-2 documents),
   regardless of how large the campaign grows. Used instead of a full
   pull whenever a student resumes (same-device session restore, or the
   duplicate-check "yes, that's me" path), so showStudentHome() can
   correctly show pre/post/quiz completion status without ever reading
   the other thousands of students' records. */
/* Shared doc -> in-memory-shape parsers, reused by every place that reads
   raw survey/quiz documents (full pull, own-records, focal-scoped, and
   the summary backfill) so this logic exists in exactly one place. */
function parseSurveyDoc(d){
  const row = d.data();
  return { id:d.id, studentId: row.studentId, institutionId: row.institutionId, phase: row.phase || row.assessment_type, answers: row.answers || {}, submittedAt: row.submittedAt || row.timestamp };
}
function parseQuizDoc(d){
  const row = d.data();
  const total = Number(row.total ?? row.total_questions) || 0;
  const score = Number(row.score) || 0;
  return {
    id:d.id, studentId: row.studentId, institutionId: row.institutionId, answers: row.answers || {}, score, total,
    pct: row.pct != null ? row.pct : (total?Math.round(score/total*100):0),
    passed: row.passed != null ? !!row.passed : row.passing_status==='PASS',
    submittedAt: row.submittedAt || row.timestamp
  };
}

/* ---------- Summary pull: institutions + summaries + gates + config ----------
   What the main dashboard (Overview / Taskforce / stat tiles / Section 1
   & 2 charts) actually refreshes on: ~21 tiny summary documents plus the
   ~21 institution documents, instead of every raw student/survey/quiz
   record. This is what makes the routine refresh cheap regardless of how
   large the campaign grows. */
async function pullSummariesFromBackend(){
  const [instSnap, summarySnap, gatesDoc, appDoc] = await Promise.all([
    fsdb.collection('institutions').get(),
    fsdb.collection('summaries').get(),
    fsdb.collection('config').doc('gates').get(),
    fsdb.collection('config').doc('app').get()
  ]);
  _lastPullAt = Date.now();
  if(instSnap.empty && !gatesDoc.exists && !appDoc.exists) return null;

  const institutions = instSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const summaries = summarySnap.docs.map(d => ({ id: d.id, ...normalizeSummary(d.data()) }));

  const settings = { ...DB.settings };
  if(gatesDoc.exists){
    const g = gatesDoc.data();
    GATE_DEFS.forEach(def=>{ if(g[def.settingKey] !== undefined) settings[def.settingKey] = !!g[def.settingKey]; });
  }
  let igsiPassword = DB.igsiPassword, taskforcePassword = DB.taskforcePassword, questions = DB.questions;
  let instrumentVersion = DB.instrumentVersion || 0;
  if(appDoc.exists){
    const a = appDoc.data();
    if(a.igsiPassword) igsiPassword = a.igsiPassword;
    if(a.taskforcePassword) taskforcePassword = a.taskforcePassword;
    if(a.questions) questions = a.questions;
    if(a.instrumentVersion != null) instrumentVersion = Number(a.instrumentVersion) || 0;
  }

  return { institutions, summaries, settings, igsiPassword, taskforcePassword, questions, instrumentVersion };
}
/* Defaults every field so summary-consuming code never has to
   null-check — an institution with no summary doc yet (brand new, or
   never backfilled) just reads as all zeros. */
function normalizeSummary(s){
  s = s || {};
  return {
    registered: s.registered||0, preCount: s.preCount||0, postCount: s.postCount||0,
    quizAttempts: s.quizAttempts||0, quizPassed: s.quizPassed||0,
    genderCounts: { Female: s.genderCounts?.Female||0, Male: s.genderCounts?.Male||0, Other: s.genderCounts?.Other||0 },
    quizGenderCounts: { Female: s.quizGenderCounts?.Female||0, Male: s.quizGenderCounts?.Male||0, Other: s.quizGenderCounts?.Other||0 },
    registeredByDay: s.registeredByDay||{}, preByDay: s.preByDay||{}, postByDay: s.postByDay||{}
  };
}
function summaryFor(instId){
  const s = DB.summaries && DB.summaries.find(x=>x.id===instId);
  return s || { id: instId, ...normalizeSummary(null) };
}

/* ---------- One-time / on-demand backfill or reconciliation ----------
   Recomputes every institution's summary document from a full read of
   the raw data, the same aggregation logic already used elsewhere in
   this file. Used once to seed summaries the first time this feature is
   deployed against an existing campaign, and available any time after
   that if summaries are ever suspected to have drifted from the raw
   data (e.g. a write that failed partway through). Expensive by design
   (reads everything) — that cost is fine for a rare, explicit action,
   which is exactly why it isn't part of the routine refresh path. */
async function recomputeAllSummaries(){
  const remote = await pullFromBackend();
  const students = remote ? remote.students : DB.students;
  const surveys = remote ? remote.surveys : DB.surveys;
  const quizzes = remote ? remote.quizzes : DB.quizzes;
  const institutions = remote ? remote.institutions : DB.institutions;

  const writeFns = institutions.map(inst => batch => {
    const instStudents = students.filter(s=>s.institutionId===inst.id);
    const ids = instStudents.map(s=>s.id);
    const gCounts = { Female:0, Male:0, Other:0 };
    const regByDay = {};
    instStudents.forEach(s=>{
      if(s.gender && gCounts[s.gender]!==undefined) gCounts[s.gender]++;
      const day = dateOnly(s.createdAt);
      if(day) regByDay[day] = (regByDay[day]||0) + 1;
    });
    const preByDay = {}, postByDay = {};
    let preCount = 0, postCount = 0;
    surveys.filter(s=>ids.includes(s.studentId)).forEach(s=>{
      const day = dateOnly(s.submittedAt);
      if(s.phase==='pre'){ preCount++; if(day) preByDay[day]=(preByDay[day]||0)+1; }
      else if(s.phase==='post'){ postCount++; if(day) postByDay[day]=(postByDay[day]||0)+1; }
    });
    const instQuizzes = quizzes.filter(q=>ids.includes(q.studentId));
    const quizGCounts = { Female:0, Male:0, Other:0 };
    instQuizzes.forEach(q=>{
      const stu = instStudents.find(s=>s.id===q.studentId);
      if(stu && stu.gender && quizGCounts[stu.gender]!==undefined) quizGCounts[stu.gender]++;
    });
    batch.set(fsdb.collection('summaries').doc(inst.id), {
      registered: instStudents.length, preCount, postCount,
      quizAttempts: instQuizzes.length, quizPassed: instQuizzes.filter(q=>q.passed).length,
      genderCounts: gCounts, quizGenderCounts: quizGCounts,
      registeredByDay: regByDay, preByDay, postByDay
    });
  });
  await commitInChunks(writeFns);
  return institutions.length;
}

async function loadOwnStudentRecords(studentId){
  try{
    const [surveySnap, quizSnap] = await Promise.all([
      fsdb.collection('surveys').where('studentId','==',studentId).get(),
      fsdb.collection('quizzes').where('studentId','==',studentId).get()
    ]);
    // Mark these as already-synced immediately — same reasoning as the
    // scoped-loader fixes above: these came FROM Firestore, so a later
    // push on this device must never treat them as new.
    const existingSurveyIds = new Set(DB.surveys.map(s=>s.id));
    const newlySeenSurveyIds = [];
    surveySnap.docs.forEach(d=>{ if(!existingSurveyIds.has(d.id)){ DB.surveys.push(parseSurveyDoc(d)); newlySeenSurveyIds.push(d.id); } });
    const existingQuizIds = new Set(DB.quizzes.map(q=>q.id));
    const newlySeenQuizIds = [];
    quizSnap.docs.forEach(d=>{ if(!existingQuizIds.has(d.id)){ DB.quizzes.push(parseQuizDoc(d)); newlySeenQuizIds.push(d.id); } });
    if(newlySeenSurveyIds.length) _syncedIds.surveys.push(...newlySeenSurveyIds);
    if(newlySeenQuizIds.length) _syncedIds.quizzes.push(...newlySeenQuizIds);
    if(newlySeenSurveyIds.length || newlySeenQuizIds.length) saveSyncedIds();
    saveLocalData(DB);
  }catch(e){
    console.error("Could not load this student's own survey/quiz history:", e);
  }
}

async function pullFromBackend(){
  const [instSnap, studentSnap, surveySnap, quizSnap, gatesDoc, appDoc] = await Promise.all([
    fsdb.collection('institutions').get(),
    fsdb.collection('students').get(),
    fsdb.collection('surveys').get(),
    fsdb.collection('quizzes').get(),
    fsdb.collection('config').doc('gates').get(),
    fsdb.collection('config').doc('app').get()
  ]);
  _lastPullAt = Date.now();
  if(instSnap.empty && studentSnap.empty && surveySnap.empty && quizSnap.empty && !gatesDoc.exists && !appDoc.exists){
    return null; // project is completely empty -> first-ever run, caller should seed it
  }

  // Institutions/students already carry their own stable Firestore document
  // ID as .id — no name-matching or merge-by-prior needed at all anymore.
  const institutions = instSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const students = studentSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const studentById = new Map(students.map(s=>[s.id, s]));
  const institutionById = new Map(institutions.map(i=>[i.id, i]));
  // Legacy fallback only: surveys/quizzes migrated from the old sheet before
  // this rewrite don't have a studentId field, only student_name+school_name
  // text — this keeps that already-migrated history resolving correctly.
  // Every survey/quiz written from this point forward has studentId set
  // directly, so this path is never exercised for new data.
  const studentIdByNameSchool = new Map(students.map(s=>[fullStudentName(s)+'||'+(institutionById.get(s.institutionId)||{}).name, s.id]));

  const surveys = surveySnap.docs.map(d=>{
    const row = d.data();
    const studentId = row.studentId || studentIdByNameSchool.get(row.student_name+'||'+row.school_name) || null;
    const stu = studentById.get(studentId);
    let answers = row.answers;
    if(!answers || !Object.keys(answers).length){
      answers = {};
      surveyQuestions(row.assessment_type || row.phase).forEach(q=>{
        const val = row[q.id];
        if(val===undefined || val==='' || val===null) return;
        if(q.type==='multi'){
          answers[q.id] = String(val).split(';').map(n=>Number(n.trim())-1).filter(n=>!isNaN(n) && n>=0);
        } else {
          const n = Number(val);
          if(!isNaN(n)) answers[q.id] = n - 1;
        }
      });
    }
    return {
      id: d.id, studentId, institutionId: row.institutionId || (stu?stu.institutionId:null),
      phase: row.phase || row.assessment_type, answers, submittedAt: row.submittedAt || row.timestamp
    };
  });

  const quizzes = quizSnap.docs.map(d=>{
    const row = d.data();
    const studentId = row.studentId || studentIdByNameSchool.get(row.student_name+'||'+row.school_name) || null;
    const stu = studentById.get(studentId);
    const total = Number(row.total ?? row.total_questions) || 0;
    const score = Number(row.score) || 0;
    return {
      id: d.id, studentId, institutionId: row.institutionId || (stu?stu.institutionId:null),
      answers: row.answers || {}, score, total,
      pct: row.pct != null ? row.pct : (total?Math.round(score/total*100):0),
      passed: row.passed != null ? !!row.passed : row.passing_status==='PASS',
      submittedAt: row.submittedAt || row.timestamp
    };
  });

  const settings = { ...DB.settings };
  if(gatesDoc.exists){
    const g = gatesDoc.data();
    GATE_DEFS.forEach(def=>{ if(g[def.settingKey] !== undefined) settings[def.settingKey] = !!g[def.settingKey]; });
  }

  let igsiPassword = DB.igsiPassword, taskforcePassword = DB.taskforcePassword, questions = DB.questions;
  let instrumentVersion = DB.instrumentVersion || 0;
  if(appDoc.exists){
    const a = appDoc.data();
    if(a.igsiPassword) igsiPassword = a.igsiPassword;
    if(a.taskforcePassword) taskforcePassword = a.taskforcePassword;
    if(a.questions) questions = a.questions; // stored as a native Firestore object, no JSON.parse needed
    if(a.instrumentVersion != null) instrumentVersion = Number(a.instrumentVersion) || 0;
  }

  _syncedIds.students = [...new Set([..._syncedIds.students, ...students.map(s=>s.id)])];
  _syncedIds.surveys  = [...new Set([..._syncedIds.surveys,  ...surveys.map(s=>s.id)])];
  _syncedIds.quizzes  = [...new Set([..._syncedIds.quizzes,  ...quizzes.map(q=>q.id)])];
  saveSyncedIds();

  return { institutions, students, surveys, quizzes, settings, igsiPassword, taskforcePassword, questions, instrumentVersion };
}

let _syncTimer = null, _syncInFlight = false, _syncQueued = false, _lastSyncError = '';
let _lastPullAt = 0; // throttle guard: avoid stacking full pulls during a burst of near-simultaneous registrations
let _institutionsDirty = false; // true only when THIS session actually added/edited/deleted/renamed an institution
let _gatesDirty = false; // true only when THIS session actually toggled a phase gate/setting
let _instrumentDirty = false; // true only when THIS device just re-seeded the question bank
let _surveyInProgress = false; // true while a student is actively inside a pre/post survey form
let _activeRole = null; // 'student' | 'focal' | 'taskforce' | 'igsi' | null — scopes background polling
let _dirtyStudentIds = new Set(); // ids of ALREADY-synced students whose profile was just edited/backfilled
let _summariesLoaded = false; // true once this session has pulled the ~21-doc summaries (taskforce/igsi Overview)
let _fullRawDataLoaded = false; // true once this session has pulled the full raw students/surveys/quizzes (Analysis Engine, drill-downs, Export, PDF report — on demand only)

/* ---------- Push: send only what's new/changed to Firestore ---------- */
/* ---------- Per-institution summary documents ----------
   One small document per institution (summaries/{institutionId}) holding
   running totals, kept in sync via atomic Firestore increments issued
   alongside each new student/survey/quiz write below. This is what lets
   the main dashboard refresh read ~21 tiny documents instead of every
   raw student/survey/quiz record — see pullSummariesFromBackend(). */
function studentSummaryIncrements(s){
  const day = dateOnly(s.createdAt);
  const ops = { registered: 1 };
  if(day) ops['registeredByDay.'+day] = 1;
  if(s.gender && GENDERS.includes(s.gender)) ops['genderCounts.'+s.gender] = 1;
  return ops;
}
function surveySummaryIncrements(s){
  const day = dateOnly(s.submittedAt);
  const field = s.phase==='pre' ? 'preCount' : 'postCount';
  const dayField = s.phase==='pre' ? 'preByDay' : 'postByDay';
  const ops = { [field]: 1 };
  if(day) ops[dayField+'.'+day] = 1;
  return ops;
}
function quizSummaryIncrements(q){
  const ops = { quizAttempts: 1 };
  if(q.passed) ops.quizPassed = 1;
  // Simplification, noted plainly rather than silently: this counts every
  // quiz ATTEMPT by gender, not distinct students, so a student who
  // retakes the quiz is counted again. Retakes are expected to be rare
  // and this only feeds an illustrative proportion chart, not a
  // certification-critical number — exact distinct-student tracking would
  // need materially more bookkeeping for little practical gain here.
  const stu = DB.students.find(x=>x.id===q.studentId);
  if(stu && stu.gender && GENDERS.includes(stu.gender)) ops['quizGenderCounts.'+stu.gender] = 1;
  return ops;
}
function queueSummaryIncrement(batch, institutionId, opsMap){
  if(!institutionId) return;
  const update = {};
  Object.keys(opsMap).forEach(k => { update[k] = firebase.firestore.FieldValue.increment(opsMap[k]); });
  // set(...,{merge:true}) with increment sentinels both creates the
  // summary doc on its first-ever write and increments existing fields —
  // no separate "create the doc" step needed anywhere.
  batch.set(fsdb.collection('summaries').doc(institutionId), update, {merge:true});
}

async function pushToBackend(){
  if(_syncInFlight){ _syncQueued = true; return; }
  _syncInFlight = true;
  updateSyncBadge('syncing');
  try{
    const newStudents = DB.students.filter(s=>!_syncedIds.students.includes(s.id));
    if(newStudents.length){
      await commitInChunks(newStudents.map(s => batch => {
        batch.set(fsdb.collection('students').doc(s.id), studentToRow(s));
        queueSummaryIncrement(batch, s.institutionId, studentSummaryIncrements(s));
      }));
      _syncedIds.students.push(...newStudents.map(s=>s.id));
    }
    // Profile edits to an ALREADY-synced student (edit-profile, or the
    // duplicate-check backfill) need an explicit re-write — Firestore has
    // no "resend everything, infer what changed" step the way the old
    // sheet reconcile did.
    const editedStudents = DB.students.filter(s=>_dirtyStudentIds.has(s.id) && _syncedIds.students.includes(s.id));
    if(editedStudents.length){
      await commitInChunks(editedStudents.map(s => batch => batch.set(fsdb.collection('students').doc(s.id), studentToRow(s), {merge:true})));
    }
    _dirtyStudentIds.clear();

    const newSurveys = DB.surveys.filter(s=>!_syncedIds.surveys.includes(s.id));
    if(newSurveys.length){
      await commitInChunks(newSurveys.map(s => batch => {
        batch.set(fsdb.collection('surveys').doc(s.id), surveyToRow(s));
        queueSummaryIncrement(batch, s.institutionId, surveySummaryIncrements(s));
      }));
      _syncedIds.surveys.push(...newSurveys.map(s=>s.id));
    }

    const newQuizzes = DB.quizzes.filter(q=>!_syncedIds.quizzes.includes(q.id));
    if(newQuizzes.length){
      await commitInChunks(newQuizzes.map(q => batch => {
        batch.set(fsdb.collection('quizzes').doc(q.id), quizToRow(q));
        queueSummaryIncrement(batch, q.institutionId, quizSummaryIncrements(q));
      }));
      _syncedIds.quizzes.push(...newQuizzes.map(q=>q.id));
    }

    saveSyncedIds();

    /* Institutions are only pushed (as a full, cheap re-write — the
       collection is small, ~20-30 docs) when THIS session actually
       changed one. Every other device's routine push — triggered by
       something unrelated like a student submitting a survey — must NOT
       touch the institutions collection at all. */
    if(_institutionsDirty){
      await commitInChunks(DB.institutions.map(inst => batch => batch.set(fsdb.collection('institutions').doc(inst.id), institutionToRow(inst))));
      _institutionsDirty = false;
    }
    /* Same reasoning as institutions: only push gate state when THIS
       session actually toggled a phase. */
    if(_gatesDirty){
      await fsdb.collection('config').doc('gates').set({
        preOpen: !!DB.settings.preOpen, postOpen: !!DB.settings.postOpen, quizOpen: !!DB.settings.quizOpen
      });
      _gatesDirty = false;
    }
    const appDocData = { igsiPassword: DB.igsiPassword, taskforcePassword: DB.taskforcePassword };
    if(_instrumentDirty){
      appDocData.questions = DB.questions; // native object — Firestore stores it as-is, no stringify needed
      appDocData.instrumentVersion = DB.instrumentVersion || INSTRUMENT_VERSION;
      _instrumentDirty = false;
    }
    await fsdb.collection('config').doc('app').set(appDocData, {merge:true});

    _lastSyncError = '';
    updateSyncBadge('synced');
  }catch(err){
    _lastSyncError = err.message || String(err);
    console.error('Backend sync failed:', err);
    updateSyncBadge('error');
  }finally{
    _syncInFlight = false;
    if(_syncQueued){ _syncQueued = false; pushToBackend(); }
  }
}

/* saveData() keeps its original name/signature so every existing call site
   works unchanged. It now saves locally AND queues a debounced push to
   Firestore, so rapid successive saves become a single network sync. */
function saveData(){
  saveLocalData(DB);
  updateSyncBadge('pending');
  if(_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(()=>{ _syncTimer = null; pushToBackend(); }, 1200);
}

function updateSyncBadge(state){
  const badge = document.getElementById('syncBadge');
  const text = document.getElementById('syncBadgeText');
  if(!badge || !text) return;
  badge.className = 'sync-badge no-print state-'+state;
  const labels = {
    connecting:'Connecting to shared data…', synced:'Synced — everyone sees this data',
    syncing:'Syncing…', pending:'Saving…', error:'Sync failed — saved on this device',
    offline:'Offline — saved on this device only'
  };
  text.textContent = labels[state] || state;
  badge.title = (state==='error' && _lastSyncError)
    ? ('Sync error: '+_lastSyncError+' — click to retry')
    : 'Click to pull the latest shared data';
}

async function manualSync(){
  updateSyncBadge('syncing');
  try{
    // Admin roles refresh from the cheap summary documents; focal
    // refreshes just its own institution's data; a student gets the core
    // pull plus their own scoped records. None of these read the full
    // raw student/survey/quiz collections.
    if(_activeRole === 'taskforce' || _activeRole === 'igsi'){
      const remote = await pullSummariesFromBackend();
      if(remote){ Object.assign(DB, remote); saveLocalData(DB); _summariesLoaded = true; }
    } else if(_activeRole === 'focal'){
      await App.ensureFocalDataLoaded(App.state.focalInstitutionId, true);
    } else {
      const core = await pullCoreFromBackend();
      if(core){ Object.assign(DB, core); saveLocalData(DB); }
      if(App.state.studentId) await loadOwnStudentRecords(App.state.studentId);
    }
    updateSyncBadge('synced');
    alert('Data refreshed from the shared database. Switch role (or reload the page) to see the latest records reflected in the view.');
  }catch(err){
    _lastSyncError = err.message || String(err);
    console.error(err);
    updateSyncBadge('error');
    alert('Could not reach the shared database: '+_lastSyncError);
  }
}

async function bootSync(){
  try{
    const core = await pullCoreFromBackend();
    if(core){
      // Partial merge only — institutions/settings/passwords/questions.
      // Whatever students/surveys/quizzes are already cached locally in
      // this browser (e.g. from a prior registration on this device)
      // stay exactly as they are; nothing here overwrites them.
      Object.assign(DB, core);
      saveLocalData(DB);
      updateSyncBadge('synced');
    } else {
      await pushToBackend(); // database is completely empty (first-ever run) — seed it with current local data
    }
  }catch(err){
    _lastSyncError = err.message || String(err);
    console.error('Initial backend sync failed, using data saved on this device:', err);
    updateSyncBadge('offline');
  }
}

/* ---------- Inactivity handling ----------
   Replaces the fixed-interval background poll entirely. Nothing refreshes
   or logs anyone out while there's real interaction happening — both
   timers only start counting once activity actually stops, and every
   click/keypress/touch resets them back to zero.
   - After 7 minutes of pure inactivity: admin roles (focal/taskforce/igsi)
     get ONE silent refresh, so numbers aren't badly stale if the screen
     is still being looked at without anyone clicking anything. Students
     never trigger this — they only ever needed the question bank once,
     not a live aggregate refresh.
   - After 15 minutes of pure inactivity, for EVERY role including
     students: log out automatically. This is also what stops a
     browser tab left open overnight (with nobody there) from silently
     polling and racking up reads for hours with no one watching. */
const IDLE_REFRESH_MS = 7 * 60 * 1000;
const IDLE_LOGOUT_MS = 15 * 60 * 1000;
let _idleRefreshTimer = null, _idleLogoutTimer = null;

function resetIdleTimers(){
  if(_idleRefreshTimer) clearTimeout(_idleRefreshTimer);
  if(_idleLogoutTimer) clearTimeout(_idleLogoutTimer);

  _idleRefreshTimer = setTimeout(async () => {
    if(_syncInFlight || _syncTimer) return;
    try{
      if(_activeRole === 'taskforce' || _activeRole === 'igsi'){
        const remote = await pullSummariesFromBackend();
        if(remote){ Object.assign(DB, remote); saveLocalData(DB); updateSyncBadge('synced'); _summariesLoaded = true; }
      } else if(_activeRole === 'focal'){
        await App.ensureFocalDataLoaded(App.state.focalInstitutionId, true);
        updateSyncBadge('synced');
      }
    }catch(err){
      console.error('Idle refresh failed:', err);
    }
  }, IDLE_REFRESH_MS);

  _idleLogoutTimer = setTimeout(() => {
    // A student mid-survey who's genuinely idle still resets this timer
    // via each answer click, so this only fires on real abandonment —
    // but skip it anyway while a survey is in progress, as a safety
    // margin against losing someone's in-progress answers mid-thought.
    if(_activeRole && !_surveyInProgress) App.logout();
  }, IDLE_LOGOUT_MS);
}
['click','keydown','touchstart'].forEach(evt => document.addEventListener(evt, resetIdleTimers, {passive:true}));
resetIdleTimers();

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,10); }
function genKey(){ return 'HHP-'+Math.random().toString(36).slice(2,6).toUpperCase(); }
function pct(a,b){ return b===0?0:Math.round((a/b)*100); }
/* Returns a shuffled copy (Fisher-Yates). Used to vary quiz question order
   per attempt so neighbouring students do not see the same sequence.
   Answer options are deliberately NOT shuffled: responses are stored as the
   option's index, so reordering them would break grading and make old and
   new submissions non-comparable. */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }

/* ============================================================
   EDITABLE QUESTION BANKS (managed by IGSI, stored in DB)
   Question types: 'single' (one choice), 'multi' (many)
   ============================================================ */
function defaultQuestionBanks(){
  return {
    pre:  instrumentCore('pre'),
    post: instrumentCore('post').concat(instrumentPostOnly()),
    quiz: QUIZ_QUESTIONS.map(q=>({id:q.id, type:'single', text:q.text, opts:[...q.opts], correct:[q.correct]}))
  };
}

/* Seed on first run, and re-seed once whenever INSTRUMENT_VERSION moves past
   what this device/sheet holds, so a revised instrument actually reaches
   everyone instead of being pulled straight back down from the sheet.
   Runs after the initial sync so the version we compare against is the
   shared one, not a stale local copy. */
function applyInstrumentVersion(){
  if(!DB.questions){ DB.questions = defaultQuestionBanks(); DB.instrumentVersion = INSTRUMENT_VERSION; _instrumentDirty = true; saveData(); return; }
  if(Number(DB.instrumentVersion||0) < INSTRUMENT_VERSION){
    const banks = defaultQuestionBanks();
    DB.questions.pre  = banks.pre;
    DB.questions.post = banks.post;      // quiz bank is left alone
    DB.instrumentVersion = INSTRUMENT_VERSION;
    _instrumentDirty = true;
    saveData();
  }
}

  /* Full pull (institutions+students+surveys+quizzes) only happens once
     per admin session, right when a role is entered — not at page boot,
     and not on every subsequent tab switch within the same dashboard. */
  /* Used at taskforce/igsi login: the cheap ~21-summary-doc refresh that
     feeds the Overview dashboard, Section 1/2 charts, and stat tiles. */
  async ensureSummariesLoaded(){
    if(_summariesLoaded) return;
    try{
      const remote = await pullSummariesFromBackend();
      if(remote){ Object.assign(DB, remote); saveLocalData(DB); }
      _summariesLoaded = true;
    }catch(e){
      console.error('Summary data load failed:', e);
      // proceed anyway with whatever's cached locally rather than block
      // the admin from seeing anything at all
    }
  },
  /* Used on-demand only — Analysis Engine tab, Export, Generate Report,
     and any chart drill-down — never automatically. These need real
     per-student/per-question detail that a summary document can't give,
     so they're deliberately kept out of the routine refresh path and
     only cost a full read the moment someone actually asks for detail. */
  async ensureFullRawDataLoaded(){
    if(_fullRawDataLoaded) return;
    try{
      const remote = await pullFromBackend();
      // Partial merge, not DB = remote: pullFromBackend()'s result has no
      // "summaries" field, so a full replace here would silently wipe
      // DB.summaries out of memory the moment Analysis Engine or Export
      // is opened, showing 0 on Overview until the next full login.
      if(remote){ Object.assign(DB, remote); saveLocalData(DB); }
      _fullRawDataLoaded = true;
    }catch(e){
      console.error('Full raw data load failed:', e);
    }
  },
  /* Focal dashboards only ever need their OWN institution's data, so this
     queries students/surveys/quizzes scoped to just that institutionId —
     bounded by that one campus's size, never the whole campaign. Pass
     force=true (used by the idle refresh / manual sync) to re-fetch even
     if already loaded this session. */
  async ensureFocalDataLoaded(instId, force){
    if(!force && this._focalDataLoadedFor === instId) return;
    try{
      const [studentSnap, surveySnap, quizSnap] = await Promise.all([
        fsdb.collection('students').where('institutionId','==',instId).get(),
        fsdb.collection('surveys').where('institutionId','==',instId).get(),
        fsdb.collection('quizzes').where('institutionId','==',instId).get()
      ]);
      // These are documents we just READ from Firestore, not new local
      // records — mark them synced immediately. Otherwise, the next time
      // this device pushes anything at all, pushToBackend() has no way to
      // tell "already exists remotely" apart from "genuinely new," and
      // re-writes (and re-increments the institution's summary counter
      // for) every student/survey/quiz merged in here.
      const existingStudentIds = new Set(DB.students.map(s=>s.id));
      const newlySeenStudentIds = [];
      studentSnap.docs.forEach(d=>{ if(!existingStudentIds.has(d.id)){ DB.students.push({ id: d.id, ...d.data() }); newlySeenStudentIds.push(d.id); } });
      const existingSurveyIds = new Set(DB.surveys.map(s=>s.id));
      const newlySeenSurveyIds = [];
      surveySnap.docs.forEach(d=>{ if(!existingSurveyIds.has(d.id)){ DB.surveys.push(parseSurveyDoc(d)); newlySeenSurveyIds.push(d.id); } });
      const existingQuizIds = new Set(DB.quizzes.map(q=>q.id));
      const newlySeenQuizIds = [];
      quizSnap.docs.forEach(d=>{ if(!existingQuizIds.has(d.id)){ DB.quizzes.push(parseQuizDoc(d)); newlySeenQuizIds.push(d.id); } });
      _syncedIds.students.push(...newlySeenStudentIds);
      _syncedIds.surveys.push(...newlySeenSurveyIds);
      _syncedIds.quizzes.push(...newlySeenQuizIds);
      saveSyncedIds();
      this._focalDataLoadedFor = instId;
      saveLocalData(DB);
    }catch(e){
      console.error('Focal data load failed:', e);
    }
  },
  /* A returning student only ever needs their OWN survey/quiz history,
     not the other thousands of students' records. */
  async enterStudentSession(studentId){
    this.state.studentId = studentId;
    sessionStorage.setItem('hhp_student_id', studentId);
    await loadOwnStudentRecords(studentId);
    this.showStudentHome();

  /* Same-form duplicate detection: matches on institution + normalized full
     name. Class is used as a tie-breaker only when BOTH records have one —
     an existing record with a blank class (the "missing data" case this
     was built for) still matches, so it can be backfilled rather than
     spawning a duplicate. */
  findLikelyExistingStudent(draft){
    const fullName = fullStudentName(draft).trim().toLowerCase();
    if(!fullName) return null;
    return DB.students.find(s=>{
      if(s.institutionId !== draft.institutionId) return false;
      if(fullStudentName(s).trim().toLowerCase() !== fullName) return false;
      const existingClass = (s.className||'').trim().toLowerCase();
      const draftClass = (draft.className||'').trim().toLowerCase();
      if(existingClass && draftClass && existingClass !== draftClass) return false;
      return true;
    });
  },
  /* Scoped to ONE institution's roster (typically tens to low hundreds of
     students) instead of a full pull of every student in the campaign.
     Bounded and cheap regardless of how large the whole campaign grows. */
  async findLikelyExistingStudentScoped(draft){
    try{
      const snap = await fsdb.collection('students').where('institutionId', '==', draft.institutionId).get();
      const existingIds = new Set(DB.students.map(s=>s.id));
      // Same reasoning as ensureFocalDataLoaded() above: these are
      // records that already exist in Firestore. Without marking them
      // synced here, this device's next push would treat this
      // institution's ENTIRE existing roster as brand new and
      // re-increment its summary counter for every one of them — this
      // was the actual cause of summary counts drifting upward (an
      // institution showing more registered students than really exist),
      // not a caching or display issue.
      const newlySeenIds = [];
      snap.docs.forEach(d=>{
        if(existingIds.has(d.id)) return;
        DB.students.push({ id: d.id, ...d.data() });
        newlySeenIds.push(d.id);
      });
      if(newlySeenIds.length){ _syncedIds.students.push(...newlySeenIds); saveSyncedIds(); }
    }catch(e){
      console.error('Duplicate-check query failed, falling back to locally cached data:', e);
    }
    const match = this.findLikelyExistingStudent(draft);
    if(match) await loadOwnStudentRecords(match.id); // so the "already completed pre-assessment on X" messaging is accurate
    return match;
  },

  confirmSameStudent(id){

      _dirtyStudentIds.add(stu.id);
      saveData();
      this.state.registerDraft = null;
      this.showStudentHome();
      return;
    }
    if(!this.state.confirmedNewDespiteMatch){
      const btn = document.getElementById('regSubmitBtn');
      // Scoped to just this one institution's roster (not a full pull of
      // every student in the campaign) — cheap and bounded regardless of
      // how large the whole campaign grows, so no throttling needed here.
      if(btn){ btn.disabled = true; btn.textContent = 'Checking existing registrations…'; }
      const possibleMatch = await this.findLikelyExistingStudentScoped(draft);
      if(btn){ btn.disabled = false; btn.textContent = 'Confirm & Save Changes'; }
      if(possibleMatch){ this.showPossibleDuplicateConfirm(possibleMatch, draft); return; }
    }
    this.state.confirmedNewDespiteMatch = false;
    const student = Object.assign({id: uid('stu'), createdAt: new Date().toISOString()}, draft);
    DB.students.push(student); 
    saveData();
    this.state.studentId = student.id;
    this.state.registerDraft = null;
    sessionStorage.setItem('hhp_student_id', student.id);
    this.showStudentHome();
  },

  /* ---------------- ASSESSMENT SURVEY MANAGEMENT ---------------- */
  startSurvey(phase){
    const isOpen = phase==='pre' ? DB.settings.preOpen : DB.settings.postOpen;
    if(!isOpen){ this.showStudentHome(); return; }
    const stu = this.currentStudent();
    const already = DB.surveys.some(s=>s.studentId===stu.id && s.phase===phase);
    if(already){ this.showStudentHome(); return; }
    this.state.surveyDraft = {};
    this.surveyStep = 0;
    _surveyInProgress = true;
    this.showSurveyForm(phase, 0);
  },
  /* ---------- Sectioned survey form ----------
     The instrument runs to 37 items (pre) / 44 (post), so it is presented
     one section per screen with a progress bar. Answers live in
     state.surveyDraft throughout, so moving between sections never loses
     anything, and validation fires per section instead of returning a
     single error after 44 questions. */
  surveyStep: 0,
  surveySections(phase){
    const names = [];
    surveyQuestions(phase).forEach(q=>{
      const sec = q.section || 'General';
      if(!names.includes(sec)) names.push(sec);
    });
    return names;
  },
  showSurveyForm(phase, step){
    this.setRoleIndicator('Survey Engine');
    const sections = this.surveySections(phase);
    this.surveyStep = Math.max(0, Math.min(step==null ? this.surveyStep : step, sections.length-1));
    const secName = sections[this.surveyStep];
    const items = surveyQuestions(phase).filter(q=>(q.section||'General')===secName);
    const isLast = this.surveyStep === sections.length-1;

    const answeredAll = surveyQuestions(phase).filter(q=>{
      const v = this.state.surveyDraft[q.id];
      return Array.isArray(v) ? v.length>0 : v!=null;
    }).length;
    const totalAll = surveyQuestions(phase).length;

    let qHtml = '';
    items.forEach((q,i)=>{
      const v = this.state.surveyDraft[q.id];
      qHtml += `<div class="q-block">
        <span class="q-num">Item ${i+1} of ${items.length}${q.type==='multi'?' · Select all that apply':''}</span>
        <div class="q-text">${escapeHtml(q.text)}</div>
        ${q.type==='multi' ? multiRows(q.id, q.opts, 'surveyDraft') : mcqRows(q.id, q.opts, 'surveyDraft')}
      </div>`;
    });

    this.el(`
      <div class="back-link no-print" onclick="App.confirmLeaveSurvey()">&larr; Back to dashboard</div>
      <div class="card">
        <span class="eyebrow">${phase==='pre'?'Baseline Pre-Campaign':'Evaluation Post-Campaign'}</span>
        <h2>SDG Campaign Assessment</h2>
        <div class="flex-between" style="margin:14px 0 6px;">
          <span class="muted">Section ${this.surveyStep+1} of ${sections.length}</span>
          <span class="muted">${answeredAll} of ${totalAll} questions answered</span>
        </div>
        <div class="pbar"><div style="width:${pct(answeredAll,totalAll)}%;"></div></div>
        <div class="section-tag" style="margin-top:18px;">${escapeHtml(secName)}</div>
        <div id="surveyError"></div>
        ${qHtml}
        <div class="btn-row">
          ${this.surveyStep>0 ? `<button class="btn btn-outline" onclick="App.surveyPrev('${phase}')">&larr; Previous section</button>` : ''}
          ${isLast
            ? `<button class="btn btn-gold" onclick="App.submitSurvey('${phase}')">Submit assessment</button>`
            : `<button class="btn btn-gold" onclick="App.surveyNext('${phase}')">Next section &rarr;</button>`}
        </div>
      </div>
    `);
    /* Re-mark anything already answered, so going back shows prior choices */
    items.forEach(q=>{
      const v = this.state.surveyDraft[q.id];
      if(v==null) return;
      document.querySelectorAll(`.opt[data-qid="${q.id}"]`).forEach(el=>{
        const val = Number(el.dataset.val);
        const on = Array.isArray(v) ? v.includes(val) : v===val;
        el.classList.toggle('selected', on);
        const inp = el.querySelector('input'); if(inp) inp.checked = on;
      });
    });
  },
  sectionUnanswered(phase){
    const sections = this.surveySections(phase);
    const secName = sections[this.surveyStep];
    return surveyQuestions(phase).filter(q=>(q.section||'General')===secName).filter(q=>{
      const v = this.state.surveyDraft[q.id];
      return Array.isArray(v) ? v.length===0 : v==null;
    }).length;
  },
  surveyNext(phase){
    const missing = this.sectionUnanswered(phase);
    if(missing > 0){
      document.getElementById('surveyError').innerHTML =
        `<div class="error-box" style="border-radius:10px;">Please answer ${missing} remaining question(s) in this section before moving on.</div>`;
      return;
    }
    this.showSurveyForm(phase, this.surveyStep+1);
  },
  surveyPrev(phase){ this.showSurveyForm(phase, this.surveyStep-1); },
  confirmLeaveSurvey(){
    const answered = Object.keys(this.state.surveyDraft).length;
    if(answered>0 && !confirm('Leave the assessment? Your answers so far will not be saved.')) return;
    this.state.surveyDraft = {};
    this.surveyStep = 0;
    _surveyInProgress = false;
    this.showStudentHome();
  },
  selectLikert(qid, val, bucket){
    this.state[bucket||'surveyDraft'][qid] = val;
    document.querySelectorAll(`.likert-opt[data-qid="${qid}"]`).forEach(el=>{
      el.classList.toggle('selected', Number(el.dataset.val)===val);
    });
  },
  selectOption(bucket, qid, val){
    this.state[bucket][qid] = val;
    document.querySelectorAll(`.opt[data-qid="${qid}"]`).forEach(el=>{
      const on = Number(el.dataset.val)===val;
      el.classList.toggle('selected', on);
      const inp = el.querySelector('input'); if(inp) inp.checked = on;
    });
  },
  toggleMulti(bucket, qid, val){
    const cur = this.state[bucket][qid] || [];
    const i = cur.indexOf(val);
    if(i>=0) cur.splice(i,1); else cur.push(val);
    this.state[bucket][qid] = cur;
    document.querySelectorAll(`.opt[data-qid="${qid}"]`).forEach(el=>{
      const on = cur.includes(Number(el.dataset.val));
      el.classList.toggle('selected', on);
      const box = el.querySelector('input'); if(box) box.checked = on;
    });
  },
  submitSurvey(phase){
    const bank = surveyQuestions(phase);
    const totalQs = bank.length;
    const answered = bank.filter(q=>{
      const v = this.state.surveyDraft[q.id];
      return Array.isArray(v) ? v.length>0 : v!=null;
    }).length;
    if(answered < totalQs){
      const gap = bank.find(q=>{ const v=this.state.surveyDraft[q.id]; return Array.isArray(v)?v.length===0:v==null; });
      const secName = gap ? (gap.section||'General') : '';
      document.getElementById('surveyError').innerHTML = `<div class="error-box" style="border-radius:10px;">${totalQs-answered} question(s) still unanswered, starting in ${escapeHtml(secName)}. Use the section buttons to go back and complete them.</div>`;
      return;
    }
    const stu = this.currentStudent();
    DB.surveys.push({id:uid('srv'), studentId:stu.id, institutionId:stu.institutionId, phase, answers:{...this.state.surveyDraft}, submittedAt:new Date().toISOString()});
    saveData();
    this.state.surveyDraft = {};
    this.surveyStep = 0;
    _surveyInProgress = false;
    this.el(`
      <div class="card" style="max-width:520px;margin:60px auto;text-align:center;">
        <h2>Assessment Recorded! ✅</h2>
        <p class="muted">Your feedback array has been securely logged within the system parameters.</p>
        <button class="btn btn-gold" onclick="App.showStudentHome()">Return to Main View</button>
      </div>
    `);
  },

  /* ---------------- KNOWLEDGE KINETICS KITS ---------------- */
  showQuiz(){
    if(!DB.settings.quizOpen){ this.showStudentHome(); return; }
    this.setRoleIndicator('Knowledge Quiz Evaluation');
    this.state.quizDraft = {};
    const bank = shuffled(quizBank());   // display order only; scoring still matches on q.id
    let qHtml = bank.map((q,idx)=>`
      <div class="q-block">
        <span class="q-num">Evaluation Block ${idx+1} / ${bank.length}${q.type==='multi'?' · Select all that apply':''}</span>
        <div class="q-text">${escapeHtml(q.text)}</div>
        ${q.type==='likert' ? likertRow(q.id,'quizDraft') : (q.type==='multi' ? multiRows(q.id, q.opts, 'quizDraft') : mcqRows(q.id, q.opts, 'quizDraft'))}
      </div>`).join('');
    this.el(`
      <div class="back-link no-print" onclick="App.showStudentHome()">&larr; Back</div>
      <div class="card">
        <span class="eyebrow">SDG Core Competencies</span>
        <h2>Knowledge Matrix Evaluation</h2>
        <p class="muted">70% target score limit (7/10 answers matched) required to execute certificate rendering routines.</p>
        <div id="quizError"></div>
        ${qHtml}
        <div class="btn-row"><button class="btn btn-gold" onclick="App.submitQuiz()">Commit Quiz Answers</button></div>
      </div>
    `);
  },
  submitQuiz(){
    const bank = quizBank();
    const answered = bank.filter(q=>{
      const v = this.state.quizDraft[q.id];
      return Array.isArray(v) ? v.length>0 : v!=null;
    }).length;
    if(answered < bank.length){
      document.getElementById('quizError').innerHTML = `<div class="error-box" style="border-radius:10px;">Answer all configuration units before execution (Completed ${answered}/${bank.length}).</div>`;
      return;
    }
    const gradable = bank.filter(q=>q.type!=='likert');
    let score = 0;
    gradable.forEach(q=>{
      const v = this.state.quizDraft[q.id];
      const correct = (q.correct||[]).slice().sort((a,b)=>a-b).join(',');
      if(q.type==='multi'){
        const given = Array.isArray(v) ? v.slice().sort((a,b)=>a-b).join(',') : '';
        if(correct!=='' && given===correct) score++;
      } else {
        if(v === (Array.isArray(q.correct)? q.correct[0] : q.correct)) score++;
      }
    });
    const total = gradable.length;
    const p = pct(score,total);
    const passed = p>=70;
    const stu = this.currentStudent();
    const record = {id:uid('qz'), studentId:stu.id, institutionId:stu.institutionId, answers:{...this.state.quizDraft}, score, total, pct:p, passed, submittedAt:new Date().toISOString()};
    DB.quizzes.push(record); saveData();
    this.showQuizResult(record);
  },
  showQuizResult(record){
    this.el(`
      <div class="card" style="max-width:560px;margin:40px auto;text-align:center;">
        <span class="eyebrow">Evaluation Result Matrix</span>
        ${scoreRingBlock(record.pct, record.score, record.total, record.passed)}
        ${record.passed
          ? `<p style="margin-top:16px;">🎉 Verification successful. Your digital profile has unlocked the formal certificate format.</p>
             <button class="btn btn-gold" onclick="App.showCertificate()">Generate Certificate Layout</button>`
          : `<p style="margin-top:16px;">Minimum profile target limits not satisfied. Review structural materials and re-evaluate.</p>
             <button class="btn btn-outline" onclick="App.showQuiz()">Relaunch Evaluation Model</button>`}
        <div style="margin-top:14px;"><button class="btn btn-outline" onclick="App.showStudentHome()">Return to Dashboard</button></div>
      </div>
    `);
  },

  /* ---------------- CHART DRILL-DOWN POPUPS ---------------- */
  async drillCampus(idx){
    await this.ensureFullRawDataLoaded();
    const inst = DB.institutions[idx];
    if(!inst) return;
    const students = DB.students.filter(s=>s.institutionId===inst.id);
    const ids = students.map(s=>s.id);
    const quizzes = DB.quizzes.filter(q=>ids.includes(q.studentId));
    const passCount = quizzes.filter(q=>q.passed).length;
    const failCount = quizzes.length - passCount;
    const gCounts = GENDERS.map(g=>students.filter(s=>s.gender===g).length);
    openDrill(inst.name, `${students.length} registered student(s) · ${quizzes.length} quiz attempt(s)`,
      `Quiz Pass vs Fail (${pct(passCount, quizzes.length)}% pass)`, 'Gender Split');
    drillChart('drillLeft', 'dl', drillDoughnutCfg(
      [`Passed (${pct(passCount,quizzes.length)}%)`, `Not Passed (${pct(failCount,quizzes.length)}%)`],
      [passCount, failCount], [C_PASS, C_FAIL]));
    drillChart('drillRight', 'dr', drillDoughnutCfg(GENDERS, gCounts, GENDER_COLORS));
  },
  async drillPassFail(segIdx, instId){
    await this.ensureFullRawDataLoaded();
    const passed = segIdx === 0;
    const segLabel = passed ? 'Passed (≥70%)' : 'Not Passed';
    const all = DB.quizzes.filter(q => !instId || q.institutionId===instId);
    const seg = all.filter(q => q.passed === passed);
    const scopeName = instId ? (DB.institutions.find(i=>i.id===instId)||{name:''}).name : 'All Campuses';
    openDrill(`Quiz Results · ${segLabel}`, `${seg.length} of ${all.length} quiz attempt(s) · ${scopeName}`,
      instId ? `Gender contribution — ${segLabel}` : `Campus contribution — ${segLabel}`,
      'Selected Portion vs Rest');
    drillChart('drillLeft', 'dl', drillContribution(instId, studs => {
      const ids = studs.map(s=>s.id);
      return seg.filter(q=>ids.includes(q.studentId)).length;
    }));
    drillChart('drillRight', 'dr', drillDoughnutCfg(
      [segLabel, 'Rest of Attempts'], [seg.length, all.length - seg.length],
      [passed ? C_PASS : C_FAIL, C_REST]));
  },
  async drillParticipation(idx, instId){
    await this.ensureFullRawDataLoaded();
    const metricNames = ['Registered','Pre-Survey Attempted','Post-Survey Attempted','Quiz Attempted'];
    const metric = metricNames[idx];
    if(!metric) return;
    const countFn = (studs) => {
      const ids = studs.map(s=>s.id);
      if(idx===0) return studs.length;
      if(idx===1) return new Set(DB.surveys.filter(x=>x.phase==='pre' && ids.includes(x.studentId)).map(x=>x.studentId)).size;
      if(idx===2) return new Set(DB.surveys.filter(x=>x.phase==='post' && ids.includes(x.studentId)).map(x=>x.studentId)).size;
      return new Set(DB.quizzes.filter(x=>ids.includes(x.studentId)).map(x=>x.studentId)).size;
    };
    const scopeStudents = DB.students.filter(s => !instId || s.institutionId===instId);
    const segCount = countFn(scopeStudents);
    const scopeName = instId ? (DB.institutions.find(i=>i.id===instId)||{name:''}).name : 'All Campuses';
    openDrill(`Participation · ${metric}`, `${segCount} of ${scopeStudents.length} registered student(s) · ${scopeName}`,
      instId ? `Gender contribution — ${metric}` : `Campus contribution — ${metric}`,
      `${metric} vs Rest of Registered`);
    drillChart('drillLeft', 'dl', drillContribution(instId, countFn));
    drillChart('drillRight', 'dr', drillDoughnutCfg(
      [metric, idx===0 ? '—' : 'Not Attempted'],
      [segCount, Math.max(scopeStudents.length - segCount, 0)],
      [C_NAVY, C_REST]));
  },
  async drillScoreDist(idx, instId){
    await this.ensureFullRawDataLoaded();
    const bands = [['0–39%',0,39],['40–69%',40,69],['70–89% (Pass)',70,89],['90–100% (Pass)',90,100]];
    const band = bands[idx];
    if(!band) return;
    const all = DB.quizzes.filter(q => !instId || q.institutionId===instId);
    const seg = all.filter(q => q.pct >= band[1] && q.pct <= band[2]);
    const scopeName = instId ? (DB.institutions.find(i=>i.id===instId)||{name:''}).name : 'All Campuses';
    openDrill(`Quiz Scores · ${band[0]}`, `${seg.length} of ${all.length} quiz attempt(s) · ${scopeName}`,
      instId ? `Gender contribution — ${band[0]}` : `Campus contribution — ${band[0]}`,
      'Selected Band vs Rest');
    drillChart('drillLeft', 'dl', drillContribution(instId, studs => {
      const ids = studs.map(s=>s.id);
      return seg.filter(q=>ids.includes(q.studentId)).length;
    }));
    drillChart('drillRight', 'dr', drillDoughnutCfg(
      [band[0], 'Rest of Attempts'], [seg.length, all.length - seg.length],
      [SCORE_BAND_COLORS[idx], C_REST]));
  },

  async drillInstituteProfile(idx){
    await this.ensureFullRawDataLoaded();
    const inst = DB.institutions[idx];
    if(!inst) return;
    const students = DB.students.filter(s=>s.institutionId===inst.id);
    const gCounts = GENDERS.map(g=>students.filter(s=>s.gender===g).length);
    const cls = classBreakdown(students);
    openDrill(inst.name, `${students.length} registered student(s)`,

  async drillTimelineDay(day){

    openDrill(day, `${reg.labels.length} campus(es) added new registrations on this day`,
      'New Registrations by Campus', 'Activity Split This Day');
    drillChart('drillLeft', 'dl', drillBarCfg(reg.labels, reg.values, reg.labels.map((_,i)=>SDG_COLORS[i%SDG_COLORS.length])));
    drillChart('drillRight', 'dr', drillDoughnutCfg(['Registered','Pre-Assessment','Post-Assessment'], [regCount,preCount,postCount], [C_NAVY, C_YELLOW, C_PASS]));

  qbBank: 'pre',
  qbEditId: null,
  qbSwitch(bank){ this.qbBank = bank; this.qbEditId = null; this.showIgsiDashboard('questions'); },
  qbTypeChanged(){
    const typeEl = document.getElementById('qbType');
    const wrap = document.getElementById('qbOptsWrap');
    if(typeEl && wrap) wrap.style.display = typeEl.value==='likert' ? 'none' : 'block';
  },
  qbEdit(id){ this.qbEditId = id; this.showIgsiDashboard('questions'); },
  qbCancelEdit(){ this.qbEditId = null; this.showIgsiDashboard('questions'); },
  qbDelete(id){
    if(!confirm('Delete this question? It will no longer appear in the form. Already-submitted responses are kept.')) return;
    DB.questions[this.qbBank] = DB.questions[this.qbBank].filter(q=>q.id!==id);
    if(this.qbEditId===id) this.qbEditId = null;
    saveData();
    this.showIgsiDashboard('questions');
  },
  qbSave(){
    const bank = this.qbBank, isQuiz = bank==='quiz';
    const err = m => { document.getElementById('qbError').innerHTML = `<div class="error-box" style="border-radius:10px;">${m}</div>`; };
    const text = document.getElementById('qbText').value.trim();
    const type = document.getElementById('qbType').value;
    const opts = type==='likert' ? [] : document.getElementById('qbOpts').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!text) return err('Question text is required.');
    if(type!=='likert' && opts.length<2) return err('Provide at least two options (one per line).');
    let correct = [];
    if(isQuiz && type!=='likert'){
      correct = document.getElementById('qbCorrect').value.split(',')
        .map(s=>parseInt(s.trim(),10)-1)
        .filter(n=>!isNaN(n) && n>=0 && n<opts.length);
      correct = [...new Set(correct)].sort((a,b)=>a-b);
      if(correct.length===0) return err('Enter valid correct option number(s), counted from 1 (e.g. "2" or "1,3").');
      if(type==='single') correct = [correct[0]];
    }
    const section = isQuiz ? undefined : (document.getElementById('qbSection').value.trim() || 'General');
    if(this.qbEditId){
      const q = DB.questions[bank].find(q=>q.id===this.qbEditId);
      if(q){
        Object.assign(q, {text, type, opts});
        if(isQuiz) q.correct = correct; else q.section = section;
      }
      this.qbEditId = null;
    } else {
      const q = {id: uid('q'), type, text, opts};
      if(isQuiz) q.correct = correct; else q.section = section;
      DB.questions[bank].push(q);
    }
    saveData();
    this.showIgsiDashboard('questions');
  },
  qbMove(id, dir){
    const arr = DB.questions[this.qbBank];
    const i = arr.findIndex(q=>q.id===id);
    const j = i + dir;
    if(i<0 || j<0 || j>=arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    saveData();
    this.showIgsiDashboard('questions');
  },

  async runRecomputeSummaries(){
    const btn = document.getElementById('recomputeSummariesBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Recomputing…'; }
    try{
      const count = await recomputeAllSummaries();
      // Immediately pull the fresh summaries and refresh the screen —
      // otherwise the currently-open Overview keeps showing whatever
      // (stale) numbers were already in memory before this ran.
      const remote = await pullSummariesFromBackend();
      if(remote){ Object.assign(DB, remote); saveLocalData(DB); }
      _summariesLoaded = true;
      if(btn){ btn.disabled = false; btn.textContent = 'Recompute All Summaries'; }
      alert(`Recomputed summaries for ${count} institution(s).`);
      this.showIgsiDashboard('overview');
      return;
    }catch(e){
      alert('Recompute failed: ' + e.message);
    }
    if(btn){ btn.disabled = false; btn.textContent = 'Recompute All Summaries'; }
  },
